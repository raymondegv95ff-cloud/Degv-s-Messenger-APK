name: Compilar APK Nativa - Degv's Messenger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Compilar PWA
        run: npm run build

      - name: Sincronizar activos con Capacitor Android
        run: npx cap sync android

      - name: Otorgar permisos de ejecucion a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug con Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-v1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
