name: Build Android APK

on:
  push:
    branches:
      - main  # Se ejecuta cada vez que haces push a la rama main
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente de tu repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Configurar Java JDK (necesario para Android Gradle)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Instalar las dependencias del proyecto web
      - name: Install dependencies
        run: npm ci

      # 5. Compilar el proyecto web (ej: React, Vue, Vite, HTML)
      - name: Build Web Assets
        run: npm run build

      # 6. Sincronizar activos web con Capacitor (o ejecutar Cordova)
      # Para Capacitor usa:
      - name: Sync Capacitor Android
        run: npx cap sync android

      # (Si usas Cordova en lugar de Capacitor, comenta la línea anterior y usa):
      # - name: Prepare Cordova Android
      #   run: npx cordova prepare android

      # 7. Compilar el APK debug usando Gradle
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 8. Guardar el APK como un "Artefacto" para poder descargarlo
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
