name: Compilar APK Nativa

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar entorno y carpeta web
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "degvs-messenger", "version": "1.0.0", "scripts": {"build": "echo no-build"}}' > package.json
          fi
          
          npm install || true
          npm run build || true

          # Crear directorio www y copiar archivos estáticos
          mkdir -p www
          rsync -av --progress . www/ --exclude www --exclude android --exclude .git --exclude .github --exclude node_modules || true

      - name: Instalar Capacitor y crear proyecto Android
        run: |
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 --save
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Dar permisos a Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: Compilar APK Nativa con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-v1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
