name: Compilar APK Nativa

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Diagnostico de Archivos
        run: |
          echo "--- BUSCANDO EL ARCHIVO MAIN.TSX ---"
          find . -name "main.tsx"
          echo "------------------------------------"

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Compilar el proyecto Web (Vite / React)
        run: |
          npm run build

      - name: Estructurar carpeta www
        run: |
          rm -rf www
          mkdir -p www
          # Copia el contenido de dist/ a www/
          cp -r dist/* www/

      - name: Configurar Java y Capacitor
        run: |
          sudo apt-get install -y openjdk-17-jdk
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 --save
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
