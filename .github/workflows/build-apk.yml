name: Compilar APK Nativa

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar package.json si no existe
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "degvs-messenger", "version": "1.0.0", "scripts": {"build": "echo no-build"}}' > package.json
          fi

      - name: Instalar dependencias y compilar si aplica
        run: |
          npm install || true
          npm run build || true

      - name: Estructurar carpeta www
        run: |
          rm -rf www
          mkdir -p www

          # Si existe carpeta dist o build (proyectos React/Vite/Vue), usar esa
          if [ -d "dist" ]; then
            cp -r dist/* www/
          elif [ -d "build" ]; then
            cp -r build/* www/
          elif [ -d "public" ]; then
            cp -r public/* www/
            cp *.html www/ 2>/dev/null || true
            cp *.js www/ 2>/dev/null || true
            cp *.css www/ 2>/dev/null || true
          else
            # Proyecto HTML/JS puro en raíz
            rsync -av --progress . www/ --exclude www --exclude android --exclude .git --exclude .github --exclude node_modules
          fi

      - name: Instalar Capacitor y Sincronizar
        run: |
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 --save
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-v1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
