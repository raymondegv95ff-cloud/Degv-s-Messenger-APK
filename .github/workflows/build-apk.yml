name: Compilar APK Nativa - Degv's Messenger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias npm
        run: npm install || true

      - name: Intentar compilacion Web (si existe script)
        run: npm run build || true

      - name: Instalar e inicializar Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Dar permisos de ejecucion a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK en modo Debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-v1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
