name: Compilar APK Nativa

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Construir proyecto
        run: |
          npm install || true
          npm run build || true

      - name: Estructurar carpeta www correctamente
        run: |
          rm -rf www
          mkdir -p www
          
          # Prioridad: Si existe carpeta dist o build, usar eso
          if [ -d "dist" ]; then cp -r dist/* www/;
          elif [ -d "build" ]; then cp -r build/* www/;
          else
            # Si no hay build, copiar todo lo que no sea de sistema
            cp -r ./* www/ 2>/dev/null || true
            rm -rf www/android www/node_modules www/.git www/.github
          fi
          
          # Verificación: Listar qué archivos quedaron en www para ver si está tu index.html
          echo "Archivos encontrados en la carpeta www:"
          ls -R www/

      - name: Instalar Capacitor y Sincronizar
        run: |
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 --save
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-v1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
