name: Compilar APK Nativa

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias
        run: |
          npm install

      - name: Garantizar archivos y servicios requeridos por App.tsx
        run: |
          mkdir -p src/services

          # 1. Crear index.css si no existe
          if [ ! -f "src/index.css" ]; then
            echo "Creando src/index.css..."
            cat << 'EOF' > src/index.css
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          body { margin: 0; background-color: #050505; color: #f1f5f9; }
          EOF
          fi

          # 2. Crear storageService.ts de respaldo si no existe
          if [ ! -f "src/services/storageService.ts" ] && [ ! -f "src/services/storageService.js" ]; then
            echo "Creando src/services/storageService.ts de respaldo..."
            cat << 'EOF' > src/services/storageService.ts
          export const storageService = {
            getItem: (key: string) => {
              try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : null;
              } catch {
                return null;
              }
            },
            setItem: (key: string, value: any) => {
              try {
                localStorage.setItem(key, JSON.stringify(value));
              } catch (e) {
                console.error('Storage error:', e);
              }
            },
            removeItem: (key: string) => {
              try {
                localStorage.removeItem(key);
              } catch (e) {
                console.error('Storage remove error:', e);
              }
            },
            clear: () => localStorage.clear()
          };

          export default storageService;
          EOF
          fi

          # 3. Asegurar rutas relativas en index.html
          sed -i 's|src="/src/main.tsx"|src="src/main.tsx"|g' index.html
          sed -i 's|href="/manifest.json"|href="manifest.json"|g' index.html

      - name: Compilar Cliente Web con Vite
        run: |
          npx vite build --base ./

      - name: Preparar carpeta www para Capacitor
        run: |
          rm -rf www
          mkdir -p www
          cp -r dist/* www/

      - name: Configurar e Instalar Capacitor Android
        run: |
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 --save
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Otorgar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug de Android
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK Generado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
