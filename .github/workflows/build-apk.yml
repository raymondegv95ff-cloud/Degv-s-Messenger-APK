name: Compilar APK Nativa

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar package.json
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "degvs-messenger", "version": "1.0.0", "scripts": {"build": "echo no-build"}}' > package.json
          fi

      - name: Compilar y volcar archivos a la carpeta www
        run: |
          npm install || true
          npm run build || true

          # Limpiar y crear la carpeta www
          rm -rf www
          mkdir -p www

          # Copiar todo el contenido del repositorio dentro de www
          cp -r ./* www/ 2>/dev/null || true

          # Si tu index.html estaba dentro de alguna subcarpeta, lo traemos a la raiz de www
          if [ ! -f www/index.html ]; then
            FOUND_INDEX=$(find . -name "index.html" -not -path "./www/*" | head -n 1)
            if [ -n "$FOUND_INDEX" ]; then
              cp "$FOUND_INDEX" www/index.html
            fi
          fi

          # Garantía total: Si por alguna razón sigue sin existir, creamos uno de emergencia con scripts vinculados
          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Degvs Messenger</title></head><body><div id="app"></div><script src="app.js"></script><script src="index.js"></script><script src="main.js"></script></body></html>' > www/index.html
          fi

      - name: Instalar e inicializar Capacitor
        run: |
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 --save
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-v1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
