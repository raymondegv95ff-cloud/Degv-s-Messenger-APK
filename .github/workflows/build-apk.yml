name: Compilar APK Nativa

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar package.json
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "degvs-messenger", "version": "1.0.0", "scripts": {"build": "echo no-build"}}' > package.json
          fi

      - name: Compilar y volcar estructura web a www
        run: |
          npm install || true
          npm run build || true

          # Limpiar y crear carpeta www
          rm -rf www
          mkdir -p www

          # Copiar todo el contenido web excepto carpetas de sistema
          for item in *; do
            if [ "$item" != "www" ] && [ "$item" != "android" ] && [ "$item" != "node_modules" ]; then
              cp -r "$item" www/ 2>/dev/null || true
            fi
          done

          # Si index.html está en una subcarpeta (ej. public/ o src/), traerlo a la raíz de www
          if [ ! -f www/index.html ]; then
            FOUND_INDEX=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "./www/*" | head -n 1)
            if [ -n "$FOUND_INDEX" ]; then
              cp "$FOUND_INDEX" www/index.html
            fi
          fi

      - name: Instalar Capacitor y Sincronizar
        run: |
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 --save
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-v1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
