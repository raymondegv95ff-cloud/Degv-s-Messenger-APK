name: Compilar APK Nativa

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias del proyecto
        run: |
          npm ci || npm install

      - name: Compilar el proyecto Web (Vite / React)
        run: |
          npm run build

      - name: Estructurar carpeta www desde dist
        run: |
          rm -rf www
          mkdir -p www
          
          if [ -d "dist" ]; then
            echo "Copiando carpeta dist a www..."
            cp -r dist/* www/
          elif [ -d "build" ]; then
            echo "Copiando carpeta build a www..."
            cp -r build/* www/
          else
            echo "ERROR: No se encontró la carpeta dist o build tras la compilación."
            exit 1
          fi

      - name: Instalar Capacitor y Sincronizar
        run: |
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 --save
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.internal.repository.max.retries=10

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
