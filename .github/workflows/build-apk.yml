name: Compilar APK Nativa

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar entorno
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "degvs-messenger", "version": "1.0.0", "scripts": {"build": "echo no-build"}}' > package.json
          fi
          npm install || true
          npm run build || true

      - name: Crear carpeta www y generar index.html
        run: |
          # Limpiar carpeta previa
          rm -rf www
          mkdir -p www

          # Copiar archivos del repositorio excluyendo directorios especiales
          for item in *; do
            if [ "$item" != "www" ] && [ "$item" != "android" ] && [ "$item" != "node_modules" ] && [ "$item" != ".git" ] && [ "$item" != ".github" ]; then
              cp -r "$item" www/ 2>/dev/null || true
            fi
          done

          # Crear index.html si no existe ninguno
          if [ ! -f www/index.html ]; then
            cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Degvs Messenger</title>
            <style>
              body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #121212; color: #fff; }
              .card { text-align: center; padding: 2rem; background: #1e1e1e; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
              h1 { color: #00e676; margin-bottom: 0.5rem; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Degvs Messenger</h1>
              <p>Aplicación nativa inicializada correctamente.</p>
            </div>
          </body>
          </html>
          EOF
          fi

      - name: Instalar Capacitor y Sincronizar
        run: |
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 --save
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-v1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
