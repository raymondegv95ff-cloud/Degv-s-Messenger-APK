name: Diagnostico de Archivos

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Listar todos los archivos del repositorio
        run: |
          echo "--- ESTRUCTURA DE ARCHIVOS EN TU REPOSITORIO ---"
          find . -maxdepth 4 -not -path '*/.*'
          echo "-----------------------------------------------"
          echo "Si ves tu index.html en la lista, dime en qué ruta aparece."
          echo "Si no lo ves, es que no has subido tus archivos de código a esta rama."
          exit 1
