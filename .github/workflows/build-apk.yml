name: Compilar APK Nativa

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias
        run: |
          npm install

      - name: Corregir archivos de entrada React (main.tsx / App.tsx)
        run: |
          mkdir -p src

          # 1. Verificar/crear App.tsx si no existe para satisfacer main.tsx
          if [ ! -f "src/App.tsx" ] && [ ! -f "src/App.jsx" ]; then
            echo "Creando src/App.tsx de respaldo..."
            cat << 'EOF' > src/App.tsx
          import React from 'react'

          export default function App() {
            return (
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', backgroundColor: '#050505', color: '#00E676', fontFamily: 'sans-serif' }}>
                <h1>Degv's Messenger</h1>
              </div>
            )
          }
          EOF
          fi

          # 2. Corregir rutas en index.html
          sed -i 's|src="/src/main.tsx"|src="src/main.tsx"|g' index.html
          sed -i 's|href="/manifest.json"|href="manifest.json"|g' index.html

      - name: Compilar Cliente Web con Vite
        run: |
          npx vite build --base ./

      - name: Preparar carpeta www para Capacitor
        run: |
          rm -rf www
          mkdir -p www
          cp -r dist/* www/

      - name: Configurar e Instalar Capacitor Android
        run: |
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 --save
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Otorgar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug de Android
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK Generado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
