name: Compilar APK Nativa

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar archivo package.json
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "degvs-messenger", "version": "1.0.0", "scripts": {"build": "echo no-build"}}' > package.json
          fi

      - name: Preparar carpeta web y asegurar index.html
        run: |
          npm install || true
          npm run build || true

          # Crear directorio www
          mkdir -p www

          # Copiar todo el contenido al directorio www
          cp -r ./* www/ 2>/dev/null || true

          # Si index.html no quedo en la raíz de www, buscarlo o crear uno de rescate
          if [ ! -f www/index.html ]; then
            INDEX_PATH=$(find . -maxdepth 3 -name "index.html" | head -n 1)
            if [ -n "$INDEX_PATH" ]; then
              cp "$INDEX_PATH" www/index.html
            else
              echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Degvs Messenger</title></head><body><div id="root"></div><h1>Degvs Messenger</h1></body></html>' > www/index.html
            fi
          fi

      - name: Instalar e inicializar Capacitor
        run: |
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 --save
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Dar permisos a Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: Compilar APK Nativa con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-v1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
