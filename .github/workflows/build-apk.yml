
name: Compilar APK Nativa

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar package.json
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "degvs-messenger", "version": "1.0.0", "scripts": {"build": "echo no-build"}}' > package.json
          fi

      - name: Preparar entorno y empaquetar código limpio
        run: |
          npm install || true
          npm run build || true

          # Limpiar carpeta www
          rm -rf www
          mkdir -p www

          # Copiar todo el repositorio EXCLUYENDO node_modules, android y git
          rsync -av --progress . www/ --exclude www --exclude android --exclude .git --exclude .github --exclude node_modules

          # Buscar el index.html REAL fuera de node_modules
          if [ ! -f www/index.html ]; then
            REAL_INDEX=$(find . -maxdepth 3 -name "index.html" -not -path "*/node_modules/*" -not -path "./www/*" | head -n 1)
            if [ -n "$REAL_INDEX" ]; then
              cp "$REAL_INDEX" www/index.html
            fi
          fi

      - name: Instalar Capacitor y Sincronizar
        run: |
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 --save
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-v1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
