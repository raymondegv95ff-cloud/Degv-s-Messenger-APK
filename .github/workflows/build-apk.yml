name: Compilar APK Nativa

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar entorno
        run: |
          npm install || true
          
      - name: Estructurar carpeta www
        run: |
          rm -rf www
          mkdir -p www
          cp -r ./* www/ 2>/dev/null || true
          rm -rf www/android www/node_modules www/.git www/.github

      - name: Instalar Capacitor y Sincronizar
        run: |
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 --save
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug (Con reintentos de red)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.internal.repository.max.retries=10

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: DegvsMessenger-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
